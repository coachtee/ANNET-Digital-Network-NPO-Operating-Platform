{% load static icons %}
<header class="site-header">
  <div class="inner">
    <a href="{% url 'sitepublic:home' %}" class="brand">
      <img src="{% static 'img/bohlale-logo.png' %}" alt="{{ NETWORK_SHORT_NAME }} logo" class="brand-logo-mark">
      <span class="brand-wordmark">
        <span class="brand-name">{{ NETWORK_SHORT_NAME }}</span>
      </span>
    </a>
    <div class="nav-panel">
      <nav class="main-nav">
        <a href="{% url 'sitepublic:directory' %}">Discover NPOs</a>
        <a href="{% url 'opportunities:public_list' %}">Opportunities</a>
        <a href="{% url 'opportunities:public_list' %}?type=partnership">Partnerships</a>
        <a href="{% url 'sitepublic:resources' %}">Resources</a>
        <a href="{% url 'opportunities:public_list' %}?type=event">Events</a>
        <a href="{% url 'sitepublic:insights' %}">Insights</a>
        <a href="{% url 'sitepublic:our_network' %}">Community</a>
      </nav>
      <div class="header-actions">
        {% if request.user.is_authenticated %}
          <a href="{% url 'organisations:workspace_home' %}" class="btn btn-outline btn-sm">My Organisation</a>
        {% else %}
          <a href="{% url 'sitepublic:join' %}" class="btn btn-primary btn-sm">Join Bohlale</a>
          <a href="{% url 'accounts:login' %}" class="btn btn-outline btn-sm">Sign In</a>
        {% endif %}
      </div>
    </div>
    <button type="button" class="nav-toggle" data-nav-toggle aria-label="Toggle menu" aria-expanded="false">
      <span class="icon-menu">{% icon "menu" %}</span>
      <span class="icon-close">{% icon "x" %}</span>
    </button>
  </div>
</header>
