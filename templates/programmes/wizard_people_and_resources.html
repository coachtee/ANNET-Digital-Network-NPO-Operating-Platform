{% extends "workspace_base.html" %}
{% block title %}{{ programme.name }}: People &amp; Resources{% endblock %}
{% block content %}
{% include "programmes/_wizard_shell.html" %}
<div class="card" style="max-width:560px;">
  <h1 style="font-size:1.5rem;">Who will deliver this programme?</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="wizard-actions">
      <a href="{% url 'programmes:wizard_step' slug=organisation.slug programme_id=programme.id step=prev_step %}" class="btn btn-ghost">Back</a>
      <button type="submit" class="btn btn-primary">Continue</button>
    </div>
  </form>
</div>
{% endblock %}
