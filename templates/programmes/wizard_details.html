{% extends "workspace_base.html" %}
{% block title %}New Programme{% endblock %}
{% block content %}
{% include "programmes/_wizard_shell.html" %}
<div class="card" style="max-width:520px;">
  <h1 style="font-size:1.5rem;">Let's start with your programme</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="wizard-actions">
      <a href="{% url 'programmes:list' slug=organisation.slug %}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save and continue</button>
    </div>
  </form>
</div>
{% endblock %}
