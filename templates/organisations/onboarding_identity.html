{% extends "base.html" %}
{% block content %}
<div class="section">
  <div class="container" style="max-width: 760px;">
    <h1>Create your organisation</h1>
    <p class="text-muted">Step 1 of 8 — Organisation Identity. This becomes your organisation's single master record on {{ NETWORK_SHORT_NAME }}.</p>
    <div class="card">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/_form_fields.html" %}
        <button type="submit" class="btn btn-primary">Create organisation and continue</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
