{% extends "base.html" %}
{% block content %}
<div class="section" style="max-width: 460px; margin: 0 auto;">
  <div class="card">
    <h1 style="font-size:1.5rem;">{% block auth_title %}{% endblock %}</h1>
    {% block auth_subtitle %}{% endblock %}
    {% if form.non_field_errors %}
      <div class="alert alert-error">{{ form.non_field_errors }}</div>
    {% endif %}
    {% block auth_content %}{% endblock %}
  </div>
</div>
{% endblock %}
