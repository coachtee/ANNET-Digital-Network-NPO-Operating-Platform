{% extends "workspace_base.html" %}
{% block title %}{{ project.name }}: Edit Task{% endblock %}
{% block content %}
{% include "projects/_project_workspace_header.html" %}

<div class="card form-card">
  <h3>Edit Task</h3>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="flex gap-8" style="margin-top:12px;">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="{% url 'projects:task_delete' slug=organisation.slug project_id=project.id task_id=task.id %}" class="btn btn-danger">Delete</a>
      <a href="{% url 'projects:tasks' slug=organisation.slug project_id=project.id %}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
