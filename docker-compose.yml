name: annet_platform

services:
  db:
    image: postgres:16-alpine
    container_name: annet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: annet_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annet_web
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - private_media_volume:/app/private_media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    expose: ["8000"]

  nginx:
    image: nginx:1.27-alpine
    container_name: annet_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./docker/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot-webroot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]

  certbot:
    image: certbot/certbot:latest
    container_name: annet_certbot
    restart: unless-stopped
    volumes:
      - ./docker/certbot-webroot:/var/www/certbot
      - ./docker/letsencrypt:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  private_media_volume:
