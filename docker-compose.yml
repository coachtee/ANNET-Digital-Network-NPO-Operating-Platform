# ANNET Digital Network & NPO Operating Platform — Coolify-first compose file.
#
# This file defines the application container only. PostgreSQL and Redis are
# NOT included here — on Coolify they are separate, first-class managed
# resources (each with its own backups, metrics and persistent volume), and
# Coolify's built-in Traefik instance handles the reverse proxy, TLS
# termination and domain routing that a bundled Nginx container used to do.
# All runtime configuration (DATABASE_URL, REDIS_URL, SECRET_KEY, ALLOWED_HOSTS,
# etc.) comes from environment variables set in the Coolify UI — see
# COOLIFY.md for the full list and step-by-step setup.
#
# This file also still works for a plain `docker compose up` (e.g. local
# development or a non-Coolify Docker host): point DATABASE_URL/REDIS_URL at
# your own Postgres/Redis, or run them as separate containers/services and
# put them on the same Docker network as `web`.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
    env_file:
      - path: .env
        required: false
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - private_media_volume:/app/private_media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  static_volume:
  media_volume:
  private_media_volume:
